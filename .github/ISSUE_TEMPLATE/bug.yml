name: Bug report
description: Report a reproducible software, grader, fixture, or documentation defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, item ID, and sanitized output. Never include credentials or private logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
      placeholder: v0.1.0-alpha.1 or a commit SHA
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal data, reviewer identities, and private transcripts.
          required: true
